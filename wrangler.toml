name = "gmailworkop"
main = "worker.js"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "BOT_KV"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
BOT_USERNAME = "GmailTaskRewardsBot"
ADMIN_CHAT_ID = "YOUR_TELEGRAM_ADMIN_ID"
SUPPORT_URL = "https://t.me/YourAdminSupport"
NEWS_URL = "https://t.me/YourProjectNews"

# Set BOT_TOKEN securely via Wrangler CLI or Cloudflare Dashboard:
# npx wrangler secret put BOT_TOKEN
